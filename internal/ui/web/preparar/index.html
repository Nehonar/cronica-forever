<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preparar Crónica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/estilo.css">
<link rel="stylesheet" href="/personaje/chat.css">
<style>
  .setup { max-width: 860px; margin: 0 auto; width: 100%; }
  .intro { font-family: var(--font-body); font-size: 1.15rem; line-height: 1.6; color: var(--ink-soft); margin: 0 0 8px; max-width: 62ch; }
  .steps { list-style: none; margin: 0; padding: 0; }
  .step { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 4px 18px; padding: 22px 0; border-top: 1px dashed var(--line); }
  .num {
    width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; grid-row: span 3;
    font-family: var(--font-display); font-size: 1.25rem; color: var(--rubric);
    border: 2px solid var(--rubric); background: rgba(0,0,0,.03);
  }
  .step.ok .num { color: var(--parch); background: var(--gold); border-color: var(--gold); box-shadow: inset 0 0 0 2px var(--parch); }
  .step.optional .num { border-style: dashed; }
  .step h3 { font-family: var(--font-display); font-weight: 400; font-size: 1.45rem; margin: 6px 0 0; }
  .state { font-family: var(--font-body); font-style: italic; color: var(--ink-soft); font-size: 1.08rem; margin: 2px 0 0; overflow-wrap: anywhere; }
  .step.ok .state { color: var(--gold); font-style: normal; }
  .state.bad { color: var(--rubric); }
  .body { margin-top: 10px; display: flex; flex-direction: column; gap: 12px; font-family: var(--font-body); font-size: 1.08rem; line-height: 1.55; }
  .body p { margin: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .choice { display: flex; flex-direction: column; gap: 8px; }
  .choice button { text-align: left; justify-content: flex-start; }
  .path { font-family: var(--font-ui); font-size: .95rem; overflow-wrap: anywhere; }
  .field {
    font: inherit; font-family: var(--font-ui); font-size: 1rem; color: var(--ink); flex: 1 1 260px; min-height: 42px;
    background: rgba(255,255,255,.35); border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; box-shadow: inset 0 1px 3px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) { .field { background: rgba(0,0,0,.25); } }
  .field:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  .body a { color: var(--rubric); }
  .hint { font-family: var(--font-body); font-style: italic; color: var(--ink-soft); font-size: 1rem; }
  .err { color: var(--rubric); font-family: var(--font-body); font-style: italic; }
  .scroll {
    margin: 0; max-height: 240px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere;
    font-family: ui-monospace, Consolas, "Cascadia Mono", monospace; font-size: .85rem; line-height: 1.45; color: var(--ink);
    background: rgba(0,0,0,.05); border: 1px solid var(--line); border-left: 3px solid var(--gold); border-radius: 3px; padding: 10px 12px;
  }
  .working { font-family: var(--font-body); font-style: italic; color: var(--ink-soft); }
  .working::after { content: "▍"; animation: blink 1s steps(2) infinite; color: var(--gold); margin-left: 2px; }
  .callout { padding: 12px 16px; border-left: 3px solid var(--rubric); background: rgba(0,0,0,.04); }
  .callout .rubric { font-size: .78rem; margin-bottom: 4px; }
  .toggle { display: inline-flex; align-items: center; gap: 12px; cursor: pointer; font-family: var(--font-body); font-size: 1.1rem; min-height: 44px; background: none; border: 0; padding: 0; color: inherit; text-align: left; }
  .toggle .track { width: 46px; height: 26px; border-radius: 13px; background: var(--line); position: relative; flex: none; border: 1px solid var(--parch-edge); transition: background .15s; }
  .toggle .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--parch); box-shadow: 0 1px 2px rgba(0,0,0,.4); transition: transform .15s; }
  .toggle[aria-checked="true"] .track { background: var(--gold); }
  .toggle[aria-checked="true"] .track::after { transform: translateX(20px); }
  .toggle:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; border-radius: 4px; }
  .finale { margin-top: 10px; padding: 22px 0 0; border-top: 1px dashed var(--line); }
  .finale ol { margin: 8px 0 16px; padding-left: 1.3em; font-family: var(--font-body); font-size: 1.1rem; line-height: 1.6; }
  .finale li::marker { color: var(--gold); font-family: var(--font-display); }
  kbd { font-family: var(--font-ui); font-size: .9em; padding: 0 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; background: rgba(255,255,255,.25); }
  .ver { font-family: var(--font-ui); font-size: .8rem; color: var(--frame-muted); }
  @media (max-width: 520px) { .step { grid-template-columns: 40px minmax(0, 1fr); gap: 4px 12px; } .num { width: 36px; height: 36px; font-size: 1.05rem; } }
  @media (prefers-reduced-motion: reduce) { .working::after { animation: none; } .toggle .track, .toggle .track::after { transition: none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="deckle" x="-2%" y="-2%" width="104%" height="104%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="11" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="9" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div class="wrap">
  <header class="frame bar">
    <div>
      <div class="bar-title">PREPARAR CRÓNICA</div>
      <div class="bar-sub">Todo lo necesario para que el cronista escriba mientras juegas</div>
    </div>
    <span class="ver" id="ver"></span>
  </header>
  <main class="page setup">
    <div class="rubric">ANTES DE LA PRIMERA PÁGINA</div>
    <h2>Pon a punto tu crónica</h2>
    <p class="intro">Cuatro pasos y listo. Lo que ya esté hecho aparece marcado; puedes volver aquí cuando quieras desde el icono de Crónica, en «Configuración».</p>
    <ol class="steps" aria-live="polite">
      <li class="step" id="s-juego"></li>
      <li class="step" id="s-claude"></li>
      <li class="step optional" id="s-github"></li>
      <li class="step" id="s-arranque"></li>
    </ol>
    <section class="finale" id="finale" hidden></section>
  </main>
</div>
<script src="preparar.js"></script>
<script src="/app/nav.js"></script>
</body>
</html>
