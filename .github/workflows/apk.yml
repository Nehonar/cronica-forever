name: App de Android

on:
  push:
    branches: [master]
    paths: ["android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compilar el APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle -p android assembleRelease --no-daemon
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/BancoYOficios.apk
      - name: Publicar para descargar desde el móvil
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-banco
          name: Banco y oficios (Android)
          body: |
            App de Android de **Banco y oficios** (Crónica de Forever).
            Descárgala desde el móvil y ábrela para instalarla (permite instalar apps de esta fuente si te lo pide).
          files: dist/BancoYOficios.apk
          make_latest: false
