name: Compilar

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore: ["docs/data/**", "personajes/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probar-y-compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Pruebas
        run: go test ./...
      - name: Compilar para Windows y Linux
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/cronica-windows-amd64.exe ./cmd/cronica
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/cronica-linux-amd64 ./cmd/cronica
      - uses: actions/upload-artifact@v4
        with:
          name: cronica
          path: dist/*
      - name: Publicar versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
